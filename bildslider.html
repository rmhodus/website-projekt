<div class="slider-container">
  <!-- Unsichtbare Radiobuttons zum Scrollen -->
  <input type="radio" name="bild-slider" id="slide1" checked>
  <input type="radio" name="bild-slider" id="slide2">
  <input type="radio" name="bild-slider" id="slide3">

  <!-- Bilderstrecke -->
  <div class="slides">
    <div class="slide">
      <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80" alt="Hotel Pool">
      <div class="caption">Sonnendeck & Pool</div>
    </div>
    <div class="slide">
      <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=800&q=80" alt="Luxus-Zimmer">
      <div class="caption">Deluxe Doppelzimmer</div>
    </div>
    <div class="slide">
      <img src="https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=800&q=80" alt="Wellnessbereich">
      <div class="caption">Spa & Wellnessbereich</div>
    </div>
  </div>

  <!-- Navigationspunkte -->
  <div class="navigation-dots">
    <label for="slide1" class="dot"></label>
    <label for="slide2" class="dot"></label>
    <label for="slide3" class="dot"></label>
  </div>
</div>
